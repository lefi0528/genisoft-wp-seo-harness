name: Test Genisoft WP SEO Harness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]
        php-version: [ '8.1', '8.2', '8.3' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        tools: composer

    - name: Validate composer.json strictly
      run: composer validate --strict

    - name: PHP Syntax Linting
      run: bash tools/lint-php.sh tools examples projects tests

    - name: Run Schema.org Validator Tests
      run: |
        node tools/schema-graph-validator.js --test
        node tests/schema-validator.test.js

    - name: Run PHP SEO Safety Verifier Self-Tests
      run: php tools/verify-seo-safety.php --self-test

    - name: Run Regression Tests
      run: |
        php tests/run-php-tests.php
        php tests/guard.test.php
        bash tests/lint-php.test.sh
        bash tests/audit-harness.test.sh

    - name: Run Harness 100-Point Audit
      run: bash tools/audit-harness.sh

  wordpress-e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none
        extensions: pdo_sqlite

    - name: End-to-end test on a real WordPress (SQLite)
      run: bash tests/e2e/wordpress-e2e.sh
